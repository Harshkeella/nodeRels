[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noderels-artifacts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "markdown-it-py>=3", "reportlab>=4.4", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["."]
